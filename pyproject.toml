[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me5412-sign-robot"
version = "0.1.0"
description = "Finite-vocabulary ASL robot simulation research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "mujoco>=3.3,<4", "Pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
sign-robot = "sign_robot.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
